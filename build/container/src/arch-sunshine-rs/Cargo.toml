[package]
name = "arch-sunshine"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[[bin]]
name = "arch-sunshine"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "signal", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-stream = "0.1"
linemux = "0.3"
futures = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
nix = { version = "0.29", features = ["fs", "mount", "user", "process", "signal", "term", "poll"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
portable-pty = "0.9"
vt100 = "0.15"
tui-term = "0.2"
